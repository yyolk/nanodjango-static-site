name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Generate static site
        run: |
          uv run website.py manage distill generate \
            --output-directory=output/ --collectstatic --force

      - name: Prefix absolute links for project site
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: |
          # Rewrite root-absolute href/src attributes so they work under the
          # GitHub Pages project path without a custom domain.
          # Leaves protocol-relative (//) and already-prefixed links alone.
          find output -name '*.html' -type f -exec sed -i \
            -e 's|href="/\([^/]\)|href="'"$BASE_PATH"'/\1|g' \
            -e 's|src="/\([^/]\)|src="'"$BASE_PATH"'/\1|g' \
            {} +

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
